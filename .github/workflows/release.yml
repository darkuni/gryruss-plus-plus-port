name: release
# Publish a GitHub release (Releases > Draft a new release > Publish) and this
# workflow builds Windows + macOS + Linux and attaches each to it as soon as
# that build finishes (a slow macOS runner no longer holds up the others).
# Run manually (Actions > release > Run workflow) to just get the builds as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build gyruss.exe
        env: {GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0'}
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o gyruss.exe ./cmd/gyruss
      - uses: actions/upload-artifact@v4
        with: {name: gyruss-windows, path: gyruss.exe}
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gyruss.exe --clobber --repo "${{ github.repository }}"

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build Gyruss.app (universal)
        run: |
          set -e
          APP="dist/Gyruss.app"
          mkdir -p "$APP/Contents/MacOS"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o dist/gy-arm64 ./cmd/gyruss
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o dist/gy-amd64 ./cmd/gyruss
          lipo -create -output "$APP/Contents/MacOS/gyruss" dist/gy-arm64 dist/gy-amd64
          cat > "$APP/Contents/Info.plist" <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>gyruss</string>
          <key>CFBundleIdentifier</key><string>local.gyruss</string>
          <key>CFBundleName</key><string>Gyruss</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PL
          codesign --force --deep -s - "$APP"
          cd dist && zip -qry ../Gyruss-mac.zip "Gyruss.app"
      - uses: actions/upload-artifact@v4
        with: {name: gyruss-mac, path: Gyruss-mac.zip}
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Gyruss-mac.zip --clobber --repo "${{ github.repository }}"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - name: Build gyruss (linux/amd64, SteamOS compatible)
        env: {GOOS: linux, GOARCH: amd64, CGO_ENABLED: '1'}
        run: |
          go build -trimpath -ldflags "-s -w" -o gyruss ./cmd/gyruss
          tar -czf Gyruss-linux.tar.gz gyruss
      - uses: actions/upload-artifact@v4
        with: {name: gyruss-linux, path: Gyruss-linux.tar.gz}
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Gyruss-linux.tar.gz --clobber --repo "${{ github.repository }}"
